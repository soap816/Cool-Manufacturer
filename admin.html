<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Store Admin | Cool Manufacturer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="page">
    <header class="topbar">
      <div>
        <span class="eyebrow">Cool Manufacturer</span>
        <h1 class="admin-title">Store admin</h1>
        <p>Update prices and your delivery fee. Changes go live for every visitor right away.</p>
      </div>
      <div class="topbar-actions">
        <a href="index.html" class="btn btn-secondary">Back to site</a>
      </div>
    </header>

    <section class="section" id="loginPanel">
      <span class="eyebrow">Login</span>
      <h3 style="margin-top:10px">Enter admin password</h3>
      <form id="loginForm" class="admin-login-form">
        <label>Password<input name="password" type="password" required autocomplete="current-password" /></label>
        <button class="btn btn-primary" type="submit" style="margin-top:16px">Log in</button>
        <p class="note" id="loginNote" role="status"></p>
      </form>
    </section>

    <section class="section" id="editPanel" hidden>
      <div class="section-head">
        <div>
          <span class="eyebrow" style="background:var(--purple);color:var(--white)">Store settings</span>
          <h3>Edit prices & delivery</h3>
        </div>
        <button class="btn btn-secondary" id="logoutBtn" type="button">Log out</button>
      </div>

      <form id="settingsForm" class="admin-form">
        <div class="admin-product" data-product="milk-cool-pack">
          <h4>Milk Cool Pack</h4>
          <label>Price (TT$)<input type="number" min="0.01" step="0.01" name="price" required /></label>
        </div>

        <div class="admin-product" data-product="plain-cool-pack">
          <h4>Plain Cool Pack</h4>
          <label>Price (TT$)<input type="number" min="0.01" step="0.01" name="price" required /></label>
        </div>

        <div class="admin-product" data-product="long-cool-pack">
          <h4>Long Cool Pack</h4>
          <label>Price (TT$)<input type="number" min="0.01" step="0.01" name="price" required /></label>
        </div>

        <div class="admin-product">
          <h4>Delivery fee</h4>
          <label>Delivery fee (TT$)<input type="number" min="0" step="0.01" id="deliveryFeeInput" required /></label>
        </div>

        <button class="btn btn-primary full" type="submit" id="saveBtn">Save changes</button>
        <p class="note" id="saveNote" role="status"></p>
      </form>
    </section>
  </div>

  <script src="admin.js"></script>
</body>
</html>
